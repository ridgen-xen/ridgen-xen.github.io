<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f6d7bd">
  <title>Sushi Tower Stack</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { background: #f7dfc9; touch-action: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      z-index: 3;
      inset: max(12px, env(safe-area-inset-top)) 0 auto;
      color: #452b28;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 0 rgba(255,255,255,.55);
    }
    #score { font-size: clamp(34px, 10vw, 54px); font-weight: 900; line-height: .95; letter-spacing: -2px; }
    #level { margin-top: 6px; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: .72; }
    #power {
      display: inline-block;
      min-height: 26px;
      margin-top: 9px;
      padding: 5px 11px;
      border: 1px solid rgba(69,43,40,.15);
      border-radius: 99px;
      background: rgba(255,255,255,.58);
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity .25s, transform .25s;
      backdrop-filter: blur(5px);
    }
    #power.show { opacity: 1; transform: translateY(0); }
    #message {
      position: fixed;
      z-index: 4;
      left: 50%; top: 27%;
      transform: translate(-50%, 10px) scale(.9);
      color: #fff;
      font-size: clamp(24px, 8vw, 42px);
      font-weight: 1000;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 3px 0 #ba4a4a, 0 7px 22px rgba(83,36,29,.32);
    }
    #message.pop { animation: pop .85s cubic-bezier(.2,.85,.25,1); }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, 14px) scale(.75); }
      22%, 68% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -24px) scale(1.08); }
    }
    .screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background: linear-gradient(165deg, rgba(255,247,232,.35), rgba(245,190,166,.3));
      transition: opacity .3s, visibility .3s;
    }
    .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card {
      width: min(100%, 390px);
      padding: 34px 26px 27px;
      border: 1px solid rgba(83,45,38,.12);
      border-radius: 30px;
      background: rgba(255,251,242,.88);
      box-shadow: 0 24px 80px rgba(103,55,42,.18), inset 0 1px #fff;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .stamp {
      display: grid;
      place-items: center;
      width: 67px; height: 67px;
      margin: -3px auto 16px;
      border: 4px solid #df5d59;
      border-radius: 18px;
      color: #df5d59;
      font-size: 35px;
      font-weight: 900;
      transform: rotate(-5deg);
    }
    h1 { margin: 0; color: #34211f; font-size: clamp(37px, 12vw, 58px); line-height: .84; letter-spacing: -3px; }
    h1 span { display: block; color: #df5d59; font-size: .62em; letter-spacing: 4px; text-transform: uppercase; }
    .tagline { margin: 18px auto 24px; color: #7b615b; font-size: 14px; line-height: 1.5; }
    .stats { display: flex; justify-content: center; gap: 26px; margin: 20px 0; color: #76534c; }
    .stat b { display: block; color: #33211f; font-size: 25px; }
    .stat small { font-size: 10px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
    button {
      width: 100%; min-height: 55px;
      border: 0; border-radius: 17px;
      background: #df5d59;
      color: #fff;
      font: 900 17px/1 inherit;
      box-shadow: 0 7px 0 #b84445, 0 12px 22px rgba(184,68,69,.24);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(4px); box-shadow: 0 3px 0 #b84445; }
    button.secondary { margin-top: 13px; background: #f0dfcc; color: #5c403a; box-shadow: 0 6px 0 #d5baa3; }
    .hint { margin: 18px 0 0; color: #9a7e76; font-size: 11px; }
    #gameover h2 { margin: 0; color: #392421; font-size: 38px; letter-spacing: -2px; }
    #shareStatus { height: 18px; margin: 12px 0 -4px; color: #64814f; font-size: 12px; font-weight: 700; }
    @media (max-height: 620px) {
      .card { padding-top: 23px; padding-bottom: 22px; }
      .stamp { width: 51px; height: 51px; margin-bottom: 11px; font-size: 27px; }
      .tagline { margin: 12px 0 16px; }
      .stats { margin: 13px 0; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Игровое поле Sushi Tower Stack"></canvas>

  <div id="hud" hidden>
    <div id="score">0</div>
    <div id="level">Этаж 1</div>
    <div id="power"></div>
  </div>
  <div id="message"></div>

  <section id="start" class="screen">
    <div class="card">
      <div class="stamp">鮨</div>
      <h1>Sushi <span>Tower Stack</span></h1>
      <p class="tagline">Лови ритм. Режь точно.<br>Построй самую высокую суши-башню.</p>
      <div class="stats">
        <div class="stat"><b id="startBest">0</b><small>Рекорд</small></div>
        <div class="stat"><b id="startDaily">0</b><small>Сегодня</small></div>
      </div>
      <button id="play">Играть</button>
      <p class="hint">Тап по экрану или пробел</p>
    </div>
  </section>

  <section id="gameover" class="screen hidden">
    <div class="card">
      <div class="stamp">終</div>
      <h2>Башня упала</h2>
      <div class="stats">
        <div class="stat"><b id="finalScore">0</b><small>Счёт</small></div>
        <div class="stat"><b id="finalBest">0</b><small>Рекорд</small></div>
      </div>
      <button id="again">Заново</button>
      <button id="share" class="secondary">Поделиться результатом</button>
      <div id="shareStatus"></div>
    </div>
  </section>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const powerEl = document.getElementById('power');
    const messageEl = document.getElementById('message');
    const startScreen = document.getElementById('start');
    const overScreen = document.getElementById('gameover');
    const shareStatus = document.getElementById('shareStatus');

    const store = {
      get(key, fallback = 0) {
        try { return Number(localStorage.getItem(key)) || fallback; } catch (_) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, String(value)); } catch (_) {}
      }
    };

    const today = new Date().toISOString().slice(0, 10);
    let best = store.get('sushiTowerBest');
    let daily = store.get('sushiTowerDate') === today ? store.get('sushiTowerDaily') : 0;
    if (store.get('sushiTowerDate') !== today) {
      store.set('sushiTowerDate', today);
      store.set('sushiTowerDaily', 0);
    }

    let W = 0, H = 0, dpr = 1;
    let gameState = 'menu';
    let layers = [];
    let mover = null;
    let debris = [];
    let particles = [];
    let score = 0;
    let level = 1;
    let combo = 0;
    let initialWidth = 0;
    let minWidth = 0;
    let camera = 0;
    let cameraTarget = 0;
    let lastTime = performance.now();
    let shake = 0;
    let flash = 0;
    let guideUntil = 0;
    let soyShield = false;
    let slowNext = false;
    let direction = 1;
    let audioCtx = null;
    let powerTimer = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (gameState === 'menu') draw(performance.now());
    }

    function roundedRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    function backgroundTheme() {
      const phase = Math.floor(Math.max(0, level - 1) / 15) % 4;
      return [
        ['#fff4df', '#f3c6b3', '#7aa87d'],
        ['#ffd5b5', '#d9847d', '#8d4d67'],
        ['#263752', '#10192d', '#86b6c8'],
        ['#35204f', '#101327', '#ff5f91']
      ][phase];
    }

    function drawBackground(now) {
      const theme = backgroundTheme();
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, theme[0]);
      gradient.addColorStop(1, theme[1]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      ctx.globalAlpha = .13;
      ctx.fillStyle = theme[2];
      for (let i = 0; i < 9; i++) {
        const x = ((i * 173 + 42) % (W + 100)) - 50;
        const y = 55 + (i % 4) * 86;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(i * .7 + Math.sin(now / 2400 + i) * .08);
        for (let p = 0; p < 5; p++) {
          ctx.rotate(Math.PI * 2 / 5);
          ctx.beginPath();
          ctx.ellipse(0, 8, 5, 10, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      const boardY = H - 82 + camera;
      ctx.fillStyle = 'rgba(69,37,29,.16)';
      ctx.fillRect(0, boardY + 13, W, 80);
      const wood = ctx.createLinearGradient(0, boardY, 0, boardY + 68);
      wood.addColorStop(0, '#d49a63');
      wood.addColorStop(1, '#a9673f');
      ctx.fillStyle = wood;
      roundedRect(-18, boardY, W + 36, 82, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(88,49,31,.2)';
      ctx.lineWidth = 2;
      for (let y = boardY + 14; y < boardY + 75; y += 13) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + Math.sin(y) * 2); ctx.stroke();
      }
    }

    function layerPalette(type, skin) {
      const classic = [
        ['#faf1d6', '#e8d7b4', '#f28b72'],
        ['#273c34', '#15271f', '#f6f0d8'],
        ['#202f29', '#12211c', '#f09c48'],
        ['#f2c27e', '#d9915e', '#fff1ce'],
        ['#faf0d6', '#dfcbaa', '#e95758']
      ];
      const spicy = [['#fff0cf','#e3c392','#e65043'],['#762f2b','#421f22','#ffd169'],['#54241f','#321615','#ef673f'],['#ee975f','#bf503c','#fff1ce'],['#ffe8bc','#e0b77e','#ff493b']];
      const gold = [['#fff4be','#d9a62e','#fff08c'],['#b07a19','#6f4812','#fff4bb'],['#72511c','#3d2d13','#ffc83d'],['#f8ca47','#bd7d16','#fff4bc'],['#ffe9a0','#ca941e','#fff8cc']];
      return (skin === 2 ? gold : skin === 1 ? spicy : classic)[type % 5];
    }

    function drawSushi(layer, alpha = 1) {
      if (layer.w <= 0) return;
      const x = layer.x;
      const y = layer.y + camera;
      const w = layer.w;
      const h = layer.h;
      const type = layer.type % 5;
      const p = layerPalette(type, layer.skin || 0);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = 'rgba(54,31,25,.24)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 5;
      roundedRect(x, y, w, h, Math.min(9, w / 5));
      ctx.fillStyle = p[0];
      ctx.fill();
      ctx.shadowColor = 'transparent';

      const shade = ctx.createLinearGradient(0, y, 0, y + h);
      shade.addColorStop(0, 'rgba(255,255,255,.24)');
      shade.addColorStop(1, 'rgba(52,28,22,.16)');
      ctx.fillStyle = shade;
      roundedRect(x, y, w, h, Math.min(9, w / 5));
      ctx.fill();

      ctx.strokeStyle = 'rgba(56,33,27,.27)';
      ctx.lineWidth = 1.4;
      roundedRect(x + .7, y + .7, Math.max(0, w - 1.4), h - 1.4, Math.min(9, w / 5));
      ctx.stroke();

      if (type === 0) {
        ctx.fillStyle = p[2];
        roundedRect(x - 2, y - 5, w + 4, h * .48, Math.min(10, w / 4));
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.26)';
        roundedRect(x + 5, y - 2, Math.max(0, w * .6), 3, 2); ctx.fill();
        ctx.strokeStyle = 'rgba(122,43,39,.25)';
        for (let i = 12; i < w; i += 22) { ctx.beginPath(); ctx.moveTo(x + i, y - 3); ctx.lineTo(x + i - 7, y + 8); ctx.stroke(); }
      } else if (type === 1) {
        ctx.fillStyle = p[1];
        roundedRect(x, y, w, h, Math.min(9, w / 5)); ctx.fill();
        const count = Math.max(1, Math.floor(w / 35));
        for (let i = 0; i < count; i++) {
          const cx = x + (i + .5) * w / count;
          ctx.fillStyle = p[2]; ctx.beginPath(); ctx.ellipse(cx, y + h / 2, Math.min(13, w / count * .37), h * .35, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = i % 2 ? '#79a95e' : '#e76455'; ctx.beginPath(); ctx.arc(cx, y + h / 2, Math.min(5, w / count * .15), 0, Math.PI * 2); ctx.fill();
        }
      } else if (type === 2) {
        ctx.fillStyle = p[1]; roundedRect(x, y, w, h, 5); ctx.fill();
        ctx.fillStyle = p[2]; roundedRect(x + 3, y - 4, Math.max(0, w - 6), h * .55, 5); ctx.fill();
        ctx.fillStyle = '#91af50';
        for (let i = 7; i < w - 3; i += 13) { ctx.beginPath(); ctx.arc(x + i, y + 3, 2.2, 0, Math.PI * 2); ctx.fill(); }
      } else if (type === 3) {
        ctx.fillStyle = p[2]; roundedRect(x, y, w, h, Math.min(8, w / 5)); ctx.fill();
        ctx.fillStyle = p[0];
        for (let i = 7; i < w; i += 12) { ctx.beginPath(); ctx.ellipse(x + i, y + h / 2, 2.5, 4, i, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#df7251'; roundedRect(x + w * .37, y + 5, w * .26, h - 10, 4); ctx.fill();
      } else {
        ctx.fillStyle = p[0]; roundedRect(x, y, w, h, 8); ctx.fill();
        ctx.fillStyle = p[2]; roundedRect(x - 1, y - 3, w + 2, h * .42, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = 2;
        for (let i = 8; i < w; i += 18) { ctx.beginPath(); ctx.moveTo(x + i, y - 1); ctx.lineTo(x + i + 7, y + 7); ctx.stroke(); }
      }

      if ((layer.skin || 0) === 2) {
        const gleam = ((performance.now() / 18) % (w + 50)) - 25;
        ctx.globalAlpha *= .5;
        ctx.strokeStyle = '#fffbe1'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x + gleam - 9, y + h); ctx.lineTo(x + gleam + 9, y); ctx.stroke();
      }
      ctx.restore();
    }

    function currentSkin() {
      return best >= 2500 ? 2 : best >= 700 ? 1 : 0;
    }

    function resetGame() {
      score = 0; level = 1; combo = 0; debris = []; particles = [];
      camera = 0; cameraTarget = 0; shake = 0; flash = 0;
      guideUntil = 0; soyShield = false; slowNext = false; direction = 1;
      initialWidth = Math.min(W * .68, 285);
      minWidth = initialWidth * .08;
      const h = Math.max(28, Math.min(34, H * .045));
      layers = [{ x: (W - initialWidth) / 2, y: H - 116, w: initialWidth, h, type: 3, skin: currentSkin() }];
      gameState = 'playing';
      startScreen.classList.add('hidden');
      overScreen.classList.add('hidden');
      hud.hidden = false;
      updateHud();
      spawnMover();
    }

    function speedForLevel(n) {
      const growth = 1 + .055 * Math.min(n, 20) + .018 * Math.log2(Math.max(1, n - 18)) * Math.max(0, n - 18);
      return Math.min(W * 1.3, Math.max(170, W * .48) * growth);
    }

    function spawnMover() {
      const top = layers[layers.length - 1];
      direction *= -1;
      const w = Math.max(minWidth, top.w);
      const spawnLeft = direction > 0;
      const reduction = slowNext ? .7 : 1;
      mover = {
        x: spawnLeft ? -w - 6 : W + 6,
        y: top.y - top.h - Math.min(66, H * .08),
        targetY: top.y - top.h,
        w, h: top.h,
        vx: speedForLevel(level) * direction * reduction,
        type: level % 5,
        skin: currentSkin(),
        dropping: false,
        vy: 0,
        bounces: 0,
        nextJuke: performance.now() + 550
      };
      slowNext = false;
      cameraTarget = Math.max(0, H * .4 - mover.targetY);
    }

    function updateHud() {
      scoreEl.textContent = score;
      levelEl.textContent = `Этаж ${level}`;
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.remove('pop');
      void messageEl.offsetWidth;
      messageEl.classList.add('pop');
    }

    function showPower(text, duration = 2500) {
      clearTimeout(powerTimer);
      powerEl.textContent = text;
      powerEl.classList.add('show');
      powerTimer = setTimeout(() => powerEl.classList.remove('show'), duration);
    }

    function grantPowerup() {
      const pick = (Math.floor(level / 8) - 1) % 3;
      if (pick === 0) {
        slowNext = true;
        showPower('● Васаби: замедление');
        showMessage('Васаби-буст!');
      } else if (pick === 1) {
        guideUntil = performance.now() + 3000;
        showPower('╎ Палочки: точный центр', 3000);
        showMessage('Палочки точности!');
      } else {
        soyShield = true;
        showPower('◆ Соус: защита от среза', 5000);
        showMessage('Соевый щит!');
      }
      sound('power');
    }

    function input() {
      if (gameState !== 'playing' || !mover || mover.dropping) return;
      unlockAudio();
      mover.dropping = true;
      mover.vy = 150;
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function landMover() {
      const prev = layers[layers.length - 1];
      const left = Math.max(mover.x, prev.x);
      const right = Math.min(mover.x + mover.w, prev.x + prev.w);
      let overlap = right - left;
      const ratio = overlap / mover.w;
      const centerDiff = Math.abs((mover.x + mover.w / 2) - (prev.x + prev.w / 2));
      const perfect = centerDiff <= Math.max(3, prev.w * .025);

      if (ratio < .12) {
        addDebris({ ...mover }, mover.x < prev.x ? -1 : 1, true);
        mover = null;
        shake = 15;
        sound('fail');
        if (navigator.vibrate) navigator.vibrate([45, 35, 90]);
        setTimeout(endGame, 650);
        gameState = 'ending';
        return;
      }

      if (perfect) {
        combo++;
        const oldX = mover.x;
        mover.x = prev.x;
        mover.w = prev.w;
        score += 20 * (combo + 1);
        flash = 1;
        sparkle(prev.x, mover.targetY, prev.w);
        showMessage(combo > 1 ? `Perfect · Комбо x${combo}!` : 'Perfect!');
        if (Math.abs(oldX - prev.x) > 2) addTinyTrim(oldX, prev.x, mover.targetY, prev.h);
        sound('perfect');
        if (navigator.vibrate) navigator.vibrate([10, 20, 18]);
      } else if (soyShield) {
        soyShield = false;
        combo = 0;
        mover.x = prev.x;
        mover.w = prev.w;
        score += 10;
        showMessage('Соус спас слой!');
        showPower('Защита использована');
        sound('power');
      } else {
        combo = 0;
        score += 10;
        if (mover.x < prev.x) {
          addDebris({ ...mover, w: prev.x - mover.x }, -1);
        } else if (mover.x + mover.w > prev.x + prev.w) {
          addDebris({ ...mover, x: prev.x + prev.w, w: mover.x + mover.w - (prev.x + prev.w) }, 1);
        }
        mover.x = left;
        mover.w = Math.max(minWidth, overlap);
        if (ratio < .25) { shake = 9; showMessage('На грани!'); }
        sound('cut');
      }

      mover.y = mover.targetY;
      layers.push({ x: mover.x, y: mover.y, w: mover.w, h: mover.h, type: mover.type, skin: mover.skin });
      mover = null;
      level++;
      updateHud();
      if (level % 8 === 0) grantPowerup();
      spawnMover();
    }

    function addTinyTrim(oldX, newX, y, h) {
      const delta = oldX - newX;
      if (Math.abs(delta) < 1) return;
      addDebris({ x: delta < 0 ? oldX : newX + layers[layers.length - 1].w, y, w: Math.abs(delta), h, type: level % 5, skin: currentSkin() }, Math.sign(delta));
    }

    function addDebris(piece, side, missed = false) {
      debris.push({
        ...piece,
        vx: side * (missed ? 95 : 55) + (Math.random() - .5) * 25,
        vy: missed ? 30 : -35,
        rotation: 0,
        vr: side * (.9 + Math.random() * 1.6),
        life: 0
      });
    }

    function sparkle(x, y, w) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: x + Math.random() * w, y: y + Math.random() * 20,
          vx: (Math.random() - .5) * 100, vy: -30 - Math.random() * 100,
          life: .7 + Math.random() * .5, max: 1.2, size: 2 + Math.random() * 3
        });
      }
    }

    function update(dt, now) {
      camera += (cameraTarget - camera) * Math.min(1, dt * 4.5);
      shake *= Math.pow(.04, dt);
      flash *= Math.pow(.08, dt);

      if (gameState === 'playing' && mover) {
        if (!mover.dropping) {
          let velocity = mover.vx;
          if (level > 10) {
            const edge = Math.min(Math.max(mover.x, 0), Math.max(0, W - mover.x - mover.w));
            velocity *= 1 + Math.max(0, 1 - edge / (W * .18)) * .15;
          }
          mover.x += velocity * dt;
          if (mover.x <= -mover.w * .12 && mover.vx < 0) { mover.x = -mover.w * .12; mover.vx *= -1; mover.bounces++; }
          if (mover.x + mover.w >= W + mover.w * .12 && mover.vx > 0) { mover.x = W - mover.w * .88; mover.vx *= -1; mover.bounces++; }
          if (level >= 5 && now > mover.nextJuke && mover.bounces > 0 && level % 5 === 0) {
            mover.vx *= -1;
            mover.nextJuke = now + 650 + Math.random() * 650;
          }
          if (level > 10) mover.x += Math.sin(now * .028 + level) * Math.min(1.2, level * .035);
        } else {
          mover.vy += 1300 * dt;
          mover.y += mover.vy * dt;
          if (mover.y >= mover.targetY) landMover();
        }
      }

      debris.forEach(p => {
        p.life += dt; p.vy += 950 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rotation += p.vr * dt;
      });
      debris = debris.filter(p => p.y + camera < H + 180 && p.life < 4);
      particles.forEach(p => { p.life -= dt; p.vy += 100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
      particles = particles.filter(p => p.life > 0);
    }

    function draw(now) {
      ctx.save();
      const sx = shake ? (Math.random() - .5) * shake : 0;
      const sy = shake ? (Math.random() - .5) * shake : 0;
      ctx.translate(sx, sy);
      drawBackground(now);

      layers.forEach(drawSushi);
      if (mover) drawSushi(mover);

      if (mover && now < guideUntil) {
        const prev = layers[layers.length - 1];
        const center = prev.x + prev.w / 2;
        ctx.save();
        ctx.setLineDash([6, 7]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(91,128,72,.7)';
        ctx.beginPath(); ctx.moveTo(center, mover.targetY + camera - 45); ctx.lineTo(center, prev.y + camera + prev.h); ctx.stroke();
        ctx.restore();
      }

      debris.forEach(p => {
        ctx.save();
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2 + camera);
        ctx.rotate(p.rotation);
        drawSushi({ ...p, x: -p.w / 2, y: -p.h / 2 - camera });
        ctx.restore();
      });

      particles.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = '#fff7a8';
        ctx.save(); ctx.translate(p.x, p.y + camera); ctx.rotate(Math.PI / 4);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore();
      });
      ctx.globalAlpha = 1;

      if (flash > .01) {
        ctx.fillStyle = `rgba(255,247,151,${flash * .2})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt, now);
      draw(now);
      requestAnimationFrame(loop);
    }

    function endGame() {
      gameState = 'over';
      best = Math.max(best, score);
      daily = Math.max(daily, score);
      store.set('sushiTowerBest', best);
      store.set('sushiTowerDaily', daily);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalBest').textContent = best;
      document.getElementById('startBest').textContent = best;
      document.getElementById('startDaily').textContent = daily;
      shareStatus.textContent = '';
      hud.hidden = true;
      overScreen.classList.remove('hidden');
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function sound(kind) {
      try {
        unlockAudio();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const data = {
          cut: [180, 105, .11, 'sine'], perfect: [520, 880, .18, 'sine'],
          fail: [145, 55, .35, 'triangle'], power: [340, 650, .22, 'sine']
        }[kind] || [300, 180, .1, 'sine'];
        osc.type = data[3]; osc.frequency.setValueAtTime(data[0], t); osc.frequency.exponentialRampToValueAtTime(data[1], t + data[2]);
        gain.gain.setValueAtTime(.08, t); gain.gain.exponentialRampToValueAtTime(.001, t + data[2]);
        osc.start(t); osc.stop(t + data[2]);
      } catch (_) {}
    }

    async function shareResult() {
      const text = `Я построил суши-башню на ${level - 1} этажей и набрал ${score} очков в Sushi Tower Stack!`;
      try {
        if (navigator.share) await navigator.share({ title: 'Sushi Tower Stack', text });
        else if (navigator.clipboard) { await navigator.clipboard.writeText(text); shareStatus.textContent = 'Результат скопирован'; }
        else { shareStatus.textContent = text; }
      } catch (err) {
        if (err.name !== 'AbortError') shareStatus.textContent = 'Не удалось поделиться';
      }
    }

    function stopButtonEvent(event) { event.stopPropagation(); }
    ['play', 'again', 'share'].forEach(id => {
      document.getElementById(id).addEventListener('touchstart', stopButtonEvent, { passive: true });
    });
    document.getElementById('play').addEventListener('click', () => { unlockAudio(); resetGame(); });
    document.getElementById('again').addEventListener('click', () => { unlockAudio(); resetGame(); });
    document.getElementById('share').addEventListener('click', shareResult);

    window.addEventListener('touchstart', event => {
      if (gameState === 'playing') { event.preventDefault(); input(); }
    }, { passive: false });
    window.addEventListener('mousedown', event => {
      if (event.button === 0 && event.target === canvas) input();
    });
    window.addEventListener('keydown', event => {
      if (event.code === 'Space') { event.preventDefault(); input(); }
    });
    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

    document.getElementById('startBest').textContent = best;
    document.getElementById('startDaily').textContent = daily;
    resize();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
